<section class="cartao">
  <header class="cartao-topo">
    <h2>Carros</h2>
    <button mat-flat-button>
      <mat-icon>add</mat-icon>
      Novo carro
    </button>
  </header>

    <mat-form-field appearance="outline" class="campo-busca">
    <mat-label>Buscar carro</mat-label>
    <input matInput [formControl]="busca" placeholder="Nome, categoria..." />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="tabela-container">
    <table mat-table [dataSource]="carros">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let carro">{{ carro.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let carro">{{ carro.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let carro">{{ carro.description }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Preço</th>
        <td mat-cell *matCellDef="let carro">
          {{ carro.price | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let carro">{{ carro.category }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let carro">
          <button mat-icon-button aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button aria-label="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let linha; columns: colunas"></tr>

    </table>
  </div>
</section>
